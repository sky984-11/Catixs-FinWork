<text x="420" y="155" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#64748b" font-weight="400">销售 / 客户 / 技术</text>
<rect x="48" y="173" width="275" height="116" rx="10" fill="#f8fafc" stroke="#dbe4ef"/>
<rect x="48" y="173" width="5" height="116" rx="2" fill="#2563eb" stroke="none"/>
<text x="66" y="203" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#0f172a" font-weight="700">创建工单</text>
<text x="66" y="232" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#475569" font-weight="400">客户、签约主体、联系人</text>
<text x="66" y="257" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#475569" font-weight="400">工单类型与业务动作</text>
<path d="M325 231H340" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="343" y="173" width="275" height="116" rx="10" fill="#f8fafc" stroke="#dbe4ef"/>
<rect x="343" y="173" width="5" height="116" rx="2" fill="#2563eb" stroke="none"/>
