<text x="48" y="569" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#7c3aed" font-weight="700">03 交付与生效</text>
<text x="420" y="569" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#64748b" font-weight="400">运维 / 网络 / 客户</text>
