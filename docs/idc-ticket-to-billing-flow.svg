<text x="361" y="410" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#0f172a" font-weight="700">拆分费用组成</text>
<text x="361" y="439" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#475569" font-weight="400">NRC / 周期费 / 用量费</text>
<text x="361" y="464" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#475569" font-weight="400">明确本地传输与包含项</text>
<path d="M620 438H635" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="638" y="380" width="275" height="116" rx="10" fill="#f8fafc" stroke="#dbe4ef"/>
<rect x="638" y="380" width="5" height="116" rx="2" fill="#0891b2" stroke="none"/>
<text x="656" y="410" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#0f172a" font-weight="700">商务复核报价</text>
<text x="656" y="439" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#475569" font-weight="400">售价、币种、合同、账期</text>
<text x="656" y="464" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#475569" font-weight="400">技术变更则重新报价</text>
<path d="M915 438H930" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="933" y="380" width="275" height="116" rx="10" fill="#f8fafc" stroke="#dbe4ef"/>
<rect x="933" y="380" width="5" height="116" rx="2" fill="#0891b2" stroke="none"/>
<text x="951" y="410" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#0f172a" font-weight="700">客户确认版本</text>
<text x="951" y="439" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#475569" font-weight="400">确认交付与计费条款</text>
<text x="951" y="464" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#475569" font-weight="400">拒绝或过期则取消明细</text>
<path d="M1210 438H1225" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1228" y="380" width="275" height="116" rx="10" fill="#f8fafc" stroke="#dbe4ef"/>
<rect x="1228" y="380" width="5" height="116" rx="2" fill="#0891b2" stroke="none"/>
<text x="1246" y="410" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#0f172a" font-weight="700">预留资源与排期</text>
<text x="1246" y="439" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#475569" font-weight="400">新开通进入交付</text>
<text x="1246" y="464" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#475569" font-weight="400">仅询价在此结束</text>
<path d="M1493 497V527H38V645H46" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
