<text x="656" y="203" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#0f172a" font-weight="700">加载动态表单</text>
<text x="656" y="232" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#475569" font-weight="400">地区、规格、A/Z端</text>
<text x="656" y="257" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#475569" font-weight="400">On-net / Off-net / 附加项</text>
<path d="M915 231H930" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="933" y="173" width="275" height="116" rx="10" fill="#f8fafc" stroke="#dbe4ef"/>
<rect x="933" y="173" width="5" height="116" rx="2" fill="#2563eb" stroke="none"/>
<text x="951" y="203" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#0f172a" font-weight="700">校验与可行性</text>
<text x="951" y="232" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#475569" font-weight="400">按阶段校验必填参数</text>
<text x="951" y="257" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#475569" font-weight="400">检查归属、覆盖与资源</text>
<path d="M1210 231H1225" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1228" y="173" width="275" height="116" rx="10" fill="#f8fafc" stroke="#dbe4ef"/>
<rect x="1228" y="173" width="5" height="116" rx="2" fill="#2563eb" stroke="none"/>
<text x="1246" y="203" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#0f172a" font-weight="700">生成需求版本</text>
<text x="1246" y="232" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#475569" font-weight="400">冻结本次需求快照</text>
<text x="1246" y="257" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#475569" font-weight="400">缺资料或不可交付则退回</text>
