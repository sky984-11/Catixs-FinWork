<text x="48" y="362" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#0891b2" font-weight="700">02 询价与确认</text>
<text x="420" y="362" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#64748b" font-weight="400">销售 / 采购 / 客户</text>
<rect x="48" y="380" width="275" height="116" rx="10" fill="#f8fafc" stroke="#dbe4ef"/>
<rect x="48" y="380" width="5" height="116" rx="2" fill="#0891b2" stroke="none"/>
<text x="66" y="410" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#0f172a" font-weight="700">匹配或询价</text>
<text x="66" y="439" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#475569" font-weight="400">匹配有效协议价 / 标准价</text>
<text x="66" y="464" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#475569" font-weight="400">楼宇接入强制询价</text>
<path d="M325 438H340" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="343" y="380" width="275" height="116" rx="10" fill="#f8fafc" stroke="#dbe4ef"/>
