<text x="66" y="646" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#475569" font-weight="400">主产品与附加项依赖</text>
<text x="66" y="671" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#475569" font-weight="400">机房 / 计算 / 网络任务</text>
<path d="M325 645H340" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="343" y="587" width="275" height="116" rx="10" fill="#f8fafc" stroke="#dbe4ef"/>
<rect x="343" y="587" width="5" height="116" rx="2" fill="#7c3aed" stroke="none"/>
<text x="361" y="617" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#0f172a" font-weight="700">实施与回填</text>
<text x="361" y="646" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#475569" font-weight="400">设备、VM、IP、线路ID</text>
<text x="361" y="671" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#475569" font-weight="400">填写实际配置和测试证据</text>
<path d="M620 645H635" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="638" y="587" width="275" height="116" rx="10" fill="#f8fafc" stroke="#dbe4ef"/>
<rect x="638" y="587" width="5" height="116" rx="2" fill="#7c3aed" stroke="none"/>
<text x="656" y="617" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#0f172a" font-weight="700">逐明细验收</text>
<text x="656" y="646" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#475569" font-weight="400">支持部分交付与验收</text>
<text x="656" y="671" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#475569" font-weight="400">失败返工；差异重新确认</text>
<path d="M915 645H930" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="933" y="587" width="275" height="116" rx="10" fill="#f8fafc" stroke="#dbe4ef"/>
<rect x="933" y="587" width="5" height="116" rx="2" fill="#7c3aed" stroke="none"/>
<text x="951" y="617" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#0f172a" font-weight="700">确认计费生效</text>
<text x="951" y="646" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#475569" font-weight="400">验收 + 报价 + 起租条件</text>
<text x="951" y="671" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#475569" font-weight="400">未达条件保持待生效</text>
<path d="M1210 645H1225" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1228" y="587" width="275" height="116" rx="10" fill="#f8fafc" stroke="#dbe4ef"/>
<rect x="1228" y="587" width="5" height="116" rx="2" fill="#7c3aed" stroke="none"/>
<text x="1246" y="617" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#0f172a" font-weight="700">形成客户产品</text>
<text x="1246" y="646" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#475569" font-weight="400">稳定服务ID与配置版本</text>
<text x="1246" y="671" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#475569" font-weight="400">绑定工单、资源和报价</text>
<path d="M1493 704V734H38V852H46" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="746" width="1504" height="185" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="48" y="776" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#059669" font-weight="700">04 结算与账单</text>
<text x="420" y="776" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#64748b" font-weight="400">计费任务 / 财务</text>
<rect x="48" y="794" width="275" height="116" rx="10" fill="#f8fafc" stroke="#dbe4ef"/>
<rect x="48" y="794" width="5" height="116" rx="2" fill="#059669" stroke="none"/>
<text x="66" y="824" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#0f172a" font-weight="700">生成费用项目</text>
<text x="66" y="853" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#475569" font-weight="400">一次性事件 / 周期订阅</text>
<text x="66" y="878" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#475569" font-weight="400">用量规则及计量来源</text>
<path d="M325 852H340" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="343" y="794" width="275" height="116" rx="10" fill="#f8fafc" stroke="#dbe4ef"/>
<rect x="343" y="794" width="5" height="116" rx="2" fill="#059669" stroke="none"/>
<text x="361" y="824" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#0f172a" font-weight="700">按生效区间结算</text>
<text x="361" y="853" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#475569" font-weight="400">起租、改价、暂停、终止</text>
<text x="361" y="878" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#475569" font-weight="400">缺报价或用量进入异常队列</text>
<path d="M620 852H635" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="638" y="794" width="275" height="116" rx="10" fill="#f8fafc" stroke="#dbe4ef"/>
<rect x="638" y="794" width="5" height="116" rx="2" fill="#059669" stroke="none"/>
<text x="656" y="824" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#0f172a" font-weight="700">防重复与合并</text>
<text x="656" y="853" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#475569" font-weight="400">一次性费只计一次</text>
<text x="656" y="878" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#475569" font-weight="400">按客户、主体、币种分组</text>
<path d="M915 852H930" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="933" y="794" width="275" height="116" rx="10" fill="#f8fafc" stroke="#dbe4ef"/>
<rect x="933" y="794" width="5" height="116" rx="2" fill="#059669" stroke="none"/>
<text x="951" y="824" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#0f172a" font-weight="700">账单草稿审核</text>
<text x="951" y="853" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#475569" font-weight="400">每行可追溯产品与工单</text>
<text x="951" y="878" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#475569" font-weight="400">退回修正；已含项不重复计</text>
<path d="M1210 852H1225" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1228" y="794" width="275" height="116" rx="10" fill="#f8fafc" stroke="#dbe4ef"/>
<rect x="1228" y="794" width="5" height="116" rx="2" fill="#059669" stroke="none"/>
<text x="1246" y="824" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#0f172a" font-weight="700">生成客户账单</text>
<text x="1246" y="853" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#475569" font-weight="400">锁定明细和价格快照</text>
<text x="1246" y="878" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#475569" font-weight="400">后续授权发送与收款核销</text>
<text x="44" y="984" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" fill="#0f172a" font-weight="700">关键控制与例外</text>
<text x="44" y="1021" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" fill="#334155" font-weight="700">类型独立</text>
<text x="162" y="1021" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#64748b" font-weight="400">故障/维护默认不收费；需收费时关联服务请求。</text>
<text x="794" y="1021" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" fill="#334155" font-weight="700">端点独立</text>
<text x="912" y="1021" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#64748b" font-weight="400">IEPL / Wave 的 A、Z 端分别选接入方式与本地传输。</text>
<text x="44" y="1078" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" fill="#334155" font-weight="700">起租独立</text>
<text x="162" y="1078" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#64748b" font-weight="400">交付完成 ≠ 工单完成 ≠ 计费开始；预付款按批准条款处理。</text>
<text x="794" y="1078" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" fill="#334155" font-weight="700">历史可追溯</text>
<text x="912" y="1078" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#64748b" font-weight="400">变更新增生效版本；尾期已终止产品仍纳入结算。</text>
<text x="44" y="1135" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" fill="#334155" font-weight="700">收入成本分开</text>
<text x="162" y="1135" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#64748b" font-weight="400">供应商成本用于内部核算，不自动变成客户售价。</text>
