<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1240" viewBox="0 0 1560 1240" role="img" aria-labelledby="title desc">
<title id="title">FinWork IDC 工单到客户账单总流程</title>
<desc id="desc">主流程按每行从左到右阅读：创建工单、选择分类和参数、报价、交付、验收、形成客户产品与费用、生成审核账单。故障维护默认不计费，楼宇接入和未知成本须询价。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<rect width="1560" height="1240" fill="#f4f7fb"/>
<text x="44" y="54" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="29" fill="#0f172a" font-weight="700">FINWORK / IDC 服务交付与计费</text>
<text x="44" y="88" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#64748b" font-weight="400">设计稿 v1 · 工单结构化采集 → 客户产品 → 费用项目 → 客户账单</text>
<rect x="28" y="125" width="1504" height="185" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
