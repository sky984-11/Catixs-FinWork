<text x="361" y="232" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#475569" font-weight="400">一级类别 → 产品 → 子类型</text>
<text x="361" y="257" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#475569" font-weight="400">一单可有多个产品明细</text>
